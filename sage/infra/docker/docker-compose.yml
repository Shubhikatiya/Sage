version: "3.8"

services:
  # ─── Postgres (Source of Truth + Event Bus MVP) ───
  postgres:
    image: postgres:16-alpine
    container_name: sage-postgres
    environment:
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: sage
      POSTGRES_DB: sage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sage"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sage-network

  # ─── Qdrant (Vector Store) ───
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sage-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sage-network

  # ─── MinIO (Blob Storage) ───
  minio:
    image: minio/minio:latest
    container_name: sage-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sage
      MINIO_ROOT_PASSWORD: sagesecret123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sage-network

  # ─── Ollama (Local LLM) ───
  ollama:
    image: ollama/ollama:latest
    container_name: sage-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (optional — remove if no GPU)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sage-network

  # ─── Sage API (FastAPI) ───
  api:
    build:
      context: ../05_implementation/backend
      dockerfile: ../../sage/infra/docker/Dockerfile.api
    container_name: sage-api
    environment:
      DATABASE_URL: postgresql://sage:sage@postgres:5432/sage
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: sage
      MINIO_SECRET_KEY: sagesecret123
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      REDIS_URL: redis://redis:6379
    ports:
      - "8020:8020"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sage-network
    volumes:
      - ../05_implementation/backend:/app
    # For development: hot reload
    command: uvicorn main_v4:app --host 0.0.0.0 --port 8020 --reload

  # ─── Redis (Cache + Pub/Sub fallback) ───
  redis:
    image: redis:7-alpine
    container_name: sage-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sage-network

  # ─── Grafana (Observability Dashboards) ───
  grafana:
    image: grafana/grafana:latest
    container_name: sage-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/docker/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - sage-network

  # ─── Prometheus (Metrics Collection) ───
  prometheus:
    image: prom/prometheus:latest
    container_name: sage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - sage-network

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  ollama_data:
  redis_data:
  grafana_data:
  prometheus_data:

networks:
  sage-network:
    driver: bridge
    name: sage-network
